data:
    dataset: "CELEBA"
    image_size: 64
    channels: 3
    logit_transform: false
    uniform_dequantization: false
    gaussian_dequantization: false
    random_flip: true
    rescaled: true
    num_workers: 4
    use_img_list_subset: true
    subset_img_dir: "/kh_code/ddim_kkh/ddim/data/celeba_1024/img_align_celeba"
    subset_img_list: "/kh_code/ddim_kkh/ddim/data/celeba_1024/selected_1024_from_img_list.json"

model:
    type: "simple"
    in_channels: 3
    out_ch: 3
    ch: 128
    ch_mult: [1, 2, 2, 2, 4]
    num_res_blocks: 2
    attn_resolutions: [16, ]
    dropout: 0.1
    var_type: fixedlarge
    ema_rate: 0.9999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

training:
    batch_size: 128
    n_epochs: 10000
    # Resume starts from step 500000 in the provided ckpt.
    # Set a very large limit to run effectively until manually stopped.
    n_iters: 999999999
    snapshot_freq: 5000
    validation_freq: 20000

sampling:
    batch_size: 32
    last_only: True

eval:
    enable: true
    freq: 5000
    n_samples: 1024
    batch_size: 64
    mem_batch_size: 128
    gap_threshold: 0.3333
    use_ema_for_eval: true
    keep_samples: false
    real_images_dir: "/kh_code/ddim_kkh/ddim/data/celeba_1024/img_align_celeba"

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    # Conservative fine-tuning LR for 1024-shot setup.
    lr: 0.0002
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    grad_clip: 1.0
